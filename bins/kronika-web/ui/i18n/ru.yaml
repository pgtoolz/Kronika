system.field.cgroup_mount_associations.label: "Точки монтирования"
system.field.cgroup_mount_associations.help: "Все записи mountinfo для этого устройства и, если само оно не смонтировано, для слоёв над ним по точным связям sysfs; служебные точки монтирования включены."
system.field.io_in_progress.label: "I/O in progress"
