system.field.cgroup_path.label: "Cgroup"
system.field.cgroup_used_cores.label: "Занято, ядер"
system.field.cgroup_used_cores.help: "Δusage_usec, делённое на длительность интервала для этой cgroup, в эквивалентных ядрах. Одно ядро равно одной CPU-секунде за секунду реального времени."
system.field.cgroup_user_cores.label: "User, ядер"
system.field.cgroup_user_cores.help: "Δuser_usec, делённое на длительность интервала для этой cgroup, в эквивалентных ядрах."
system.field.cgroup_system_cores.label: "System, ядер"
system.field.cgroup_system_cores.help: "Δsystem_usec, делённое на длительность интервала для этой cgroup, в эквивалентных ядрах."
system.field.cgroup_other_cores.label: "Прочее, ядер"
system.field.cgroup_other_cores.help: "(Δusage_usec − Δuser_usec − Δsystem_usec), делённое на длительность интервала, в эквивалентных ядрах. При несогласованных счётчиках значение недоступно."
system.field.cgroup_capacity.label: "Доступно, ядер"
system.field.cgroup_capacity.help: "Минимум из самой строгой конечной квоты в иерархии этой cgroup и её effective cpuset; если оба ограничения не заданы, значение недоступно."
system.field.cgroup_quota.label: "Квота, ядер"
system.field.cgroup_quota.help: "quota_usec / period_usec для этой cgroup; родительская cgroup может задать меньший effective limit."
