pg.help.relation.scan_rate: "Прирост счётчика scan таблицы или индекса, делённый на длительность интервала."
pg.help.relation.index_entries_rate: "Прирост числа index tuple, возвращённых scan, делённый на длительность интервала; это записи индекса, а не rows таблицы."
pg.help.relation.rows_fetched_rate: "Прирост числа живых rows таблицы, полученных через index scan, делённый на длительность интервала."
pg.help.relation.maintenance_rate: "Прирост счётчика выбранной операции обслуживания, делённый на длительность интервала."
pg.help.relation.per_scan: "Прирост счётчика rows или index tuple, делённый на прирост числа scan. Без scan значение недоступно."
pg.help.relation.dml_share: "Прирост счётчика выбранного изменения rows, делённый на сумму приростов insert, update и delete."
pg.help.relation.row_estimate: "Оценка PostgreSQL для числа строк с указанным условием после обслуживания."
pg.help.relation.maintenance_mean: "Прирост времени обслуживания, делённый на прирост числа операций, в миллисекундах. Поле доступно с PostgreSQL 18; без операций значение недоступно."
pg.help.relation.buffer_hit: "Buffer hits, делённые на сумму hits и чтений извне shared buffers PostgreSQL. Чтение извне buffer может обслужить page cache ОС."
pg.help.relation.buffer_bytes: "Buffer bytes таблицы или индекса в секунду по записанному block_size. Hits — логическая активность; чтение извне может обслуживаться OS page cache."
pg.help.relation.last_scan: "Время последнего соответствующего сканирования. Поле доступно начиная с PostgreSQL 16."
pg.help.relation.last_maintenance: "Время последней указанной операции обслуживания."
pg.help.relation.oldest_timestamp: "Самая ранняя непустая отметка времени среди объектов группы."
pg.help.relation.latest_timestamp: "Самая поздняя непустая отметка времени среди объектов группы."
pg.help.relation.never_count: "Число применимых объектов без записанной отметки времени указанной операции."
pg.help.relation.toast_never_count: "Число таблиц, для которых у TOAST relation не записано время последнего autovacuum."
pg.help.relation.index_state_count: "Число индексов группы, для которых указанное состояние pg_index истинно."
pg.help.relation.tuple_throughput: "Сумма tuple, возвращённых seq scan и полученных через index scan, делённая на длительность интервала."
pg.help.relation.sequential_share: "Прирост числа seq scan, делённый на сумму приростов seq scan и index scan. Без scan значение недоступно."
pg.help.relation.dml_total: "Сумма приростов счётчиков inserted, updated и deleted rows, делённая на длительность интервала."
pg.help.relation.hot_share: "Прирост числа HOT update, делённый на прирост числа update. Без update значение недоступно."
pg.help.relation.new_page_share: "Прирост числа new-page update, делённый на прирост числа update. Поле доступно с PostgreSQL 16; без update значение недоступно."
pg.help.relation.dead_share: "Оценка числа dead tuple, делённая на сумму оценок live и dead tuple."
pg.help.relation.displayed_storage: "Сумма размера основного слоя таблицы и полного размера служебного хранилища длинных значений. Обычные индексы и другие слои таблицы не входят."
pg.help.relation.table_data: "Размер основного слоя таблицы по данным pg_relation_size, в байтах."
pg.help.relation.index_data: "Размер основного слоя индекса по данным pg_relation_size, в байтах."
pg.help.relation.toast_share: "Полный размер TOAST relation, делённый на сумму размера main fork таблицы и TOAST."
pg.help.relation.reltuples: "Оценка планировщика pg_class.reltuples, в строках; -1 означает отсутствие оценки."
pg.help.relation.toast_dead_share: "Оценка числа dead TOAST tuple, делённая на сумму оценок live и dead TOAST tuple."
pg.help.relation.xid_age: "Возраст relfrozenxid, в транзакциях; для групп показан максимум. Для секционированных родительских таблиц значение недоступно."
pg.help.relation.mxid_age: "Возраст relminmxid, в мультитранзакциях; для групп показан максимум. Для секционированных родительских таблиц значение недоступно."
pg.help.relation.no_scans: "Счётчик index scan не изменился за выбранный интервал при наличии обоих значений. Недоступный интервал остаётся недоступным."
pg.help.relation.no_scan_count: "Число индексов группы с известным нулевым приростом счётчика scan за выбранный интервал."
pg.help.relation.known_scan_count: "Число индексов группы, у которых счётчик scan вырос за выбранный интервал."
pg.help.relation.indisvalid: "Показывает, помечен ли индекс в pg_index как пригодный для запросов."
pg.help.relation.indisready: "Показывает, помечен ли индекс в pg_index как готовый принимать новые вставки."
pg.help.relation.indisprimary: "Показывает, обеспечивает ли индекс ограничение первичного ключа по данным pg_index."
pg.help.relation.indisunique: "Показывает, обеспечивает ли индекс уникальность по данным pg_index."
pg.help.relation.indisexclusion: "Показывает, обеспечивает ли индекс ограничение-исключение по данным pg_index."
