system.field.read_latency_ms.label: "Read latency"
system.field.read_latency_ms.help: "Δread_time_ms / Δreads между соседними снимками устройства. Без пригодного предыдущего снимка, после отката счётчика или при отсутствии завершённых чтений значение недоступно."
system.field.write_latency_ms.label: "Write latency"
system.field.write_latency_ms.help: "Δwrite_time_ms / Δwrites между соседними снимками устройства. Без пригодного предыдущего снимка, после отката счётчика или при отсутствии завершённых записей значение недоступно."
system.field.device_busy.label: "Device busy"
