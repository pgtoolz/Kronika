lane.health.label: "Health"
lane.health.overall_health: "Overall"
lane.health.overall_health.help: "Overall = clamp(100 − штраф OS − штраф PostgreSQL, 0, 100), где штраф = 100 − Health компонента. Выключенный PostgreSQL даёт нулевой штраф; при включённом PostgreSQL без пригодного текущего значения Overall недоступен."
lane.health.os_health: "OS"
lane.health.os_health.help: "OS Health = 100 − round(100 × min(max(ΔCPU some_total, Δmemory some_total, ΔI/O some_total) / время между снимками, 1)). Без соседних пригодных счётчиков значение недоступно."
lane.health.postgres_health: "PostgreSQL"
lane.health.postgres_health.help: "A — число строк pg_stat_activity со state=active; C — ёмкость CPU в ядрах. Явное KRONIKA_POSTGRES_EFFECTIVE_CPUS имеет приоритет; без него C берётся из последнего записанного снимка CPU VM или квоты/cpuset контейнера не позже снимка Activity. Для удалённого PostgreSQL или другой контрольной группы задайте C явно. При A=0 Health=100; иначе 100 − round(100 × max(A − 2 × C, 0) / A). Без ёмкости или пригодного снимка значение недоступно."
lane.memory.label: "Memory"
lane.memory.help: "Занятая память хоста: 100 × (MemTotal − MemAvailable) / MemTotal в записанном снимке."
