lane.health.label: "Health"
lane.health.overall_health: "Overall"
lane.health.overall_health.help: "Overall = clamp(100 − OS penalty − PostgreSQL penalty, 0, 100), where penalty = 100 − component Health. Disabled PostgreSQL contributes zero; enabled PostgreSQL without a usable current value makes Overall unavailable."
lane.health.os_health: "OS"
lane.health.os_health.help: "OS Health = 100 − round(100 × min(max(ΔCPU some_total, Δmemory some_total, ΔI/O some_total) / elapsed time, 1)). It is unavailable without adjacent usable counters."
lane.health.postgres_health: "PostgreSQL"
lane.health.postgres_health.help: "A counts pg_stat_activity rows with state=active; C is CPU capacity in cores. Explicit KRONIKA_POSTGRES_EFFECTIVE_CPUS wins; otherwise C uses the latest recorded VM CPU snapshot or container quota/cpuset at or before the activity sample. Set C explicitly for remote PostgreSQL or a different cgroup. For A=0, Health=100; otherwise 100 − round(100 × max(A − 2 × C, 0) / A). Unavailable without capacity or usable activity."
lane.memory.label: "Memory"
lane.memory.help: "Host memory in use: 100 × (MemTotal − MemAvailable) / MemTotal at the recorded sample."
