filter.help.grammar: "Use field:value for IDs and text, or field>quantity and field<quantity for metrics. Combine with AND or OR; AND runs first, and parentheses change the order. Keywords save uppercase. Input without field syntax is free text."
filter.help.rules: "Comparisons are exact before sorting and paging. MB is decimal; MiB is binary. Rates use /s; unavailable stays null, never zero. Units and operators are case-sensitive. In grouped Tables or Indexes, OR cannot mix text with metrics; connect them with AND. NOT is unsupported. Search applies only when wholly valid."
