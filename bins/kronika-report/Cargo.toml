[package]
name = "kronika-report-cli"
description = "Generates one self-contained Kronika HTML report from one standalone ZMS"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kronika-report"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
kronika-report = { path = "../../crates/kronika-report", features = ["generator"] }
tempfile = "3"

[dev-dependencies]
kronika-store = { path = "../../crates/kronika-store" }

[lints]
workspace = true
