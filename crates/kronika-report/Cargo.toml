[package]
name = "kronika-report"
description = "Portable report queries and optional native self-contained HTML generation"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["generator"]
generator = [
    "dep:base64",
    "dep:flate2",
    "dep:kronika-format",
    "dep:kronika-reader",
    "kronika-store/posix",
]

[[test]]
name = "html_writer"
path = "tests/html_writer.rs"
required-features = ["generator"]

[dependencies]
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
kronika-format = { path = "../kronika-format", optional = true }
kronika-index = { path = "../kronika-index", default-features = false }
kronika-layout = { path = "../kronika-layout", default-features = false }
kronika-query = { path = "../kronika-query", default-features = false }
kronika-reader = { path = "../kronika-reader", default-features = false, optional = true }
kronika-store = { path = "../kronika-store", default-features = false }

[dev-dependencies]
tempfile = "3"
kronika-registry = { path = "../kronika-registry" }
kronika-writer = { path = "../kronika-writer" }
serde_json = "1"

[lints]
workspace = true
