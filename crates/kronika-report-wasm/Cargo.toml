[package]
name = "kronika-report-wasm"
description = "Browser-callable adapter for one embedded Kronika report"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kronika-api = { path = "../kronika-api", default-features = false }
kronika-layout = { path = "../kronika-layout", default-features = false }
kronika-query = { path = "../kronika-query", default-features = false }
kronika-report = { path = "../../bins/kronika-report", default-features = false }
wasm-bindgen = { version = "=0.2.127", default-features = false, features = ["std"] }

[lints]
workspace = true
