name: Rebuild report assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-assets:
    runs-on: ubuntu-24.04
    env:
      CC_wasm32_unknown_unknown: clang-18
      AR_wasm32_unknown_unknown: llvm-ar-18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Install the pinned WebAssembly target
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-18 llvm-18
      - name: Rebuild report wasm assets
        run: RUST_TOOLCHAIN=1.96.0 scripts/report-assets.sh build --download-bindgen
      - name: Upload rebuilt assets
        uses: actions/upload-artifact@v4
        with:
          name: report-assets-170
          path: |
            crates/kronika-report/assets/kronika-report-wasm.js
            crates/kronika-report/assets/kronika-report-wasm.wasm.gz
          if-no-files-found: error
